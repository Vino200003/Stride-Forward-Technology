<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#022A68" />
    <!-- Fallback title; each page sets its own title, description and Open Graph tags via react-helmet-async (src/components/ui/Seo.tsx) -->
    <title>Stride Forward Technology | Custom Software Built Around Your Business</title>
    <!-- Self-hosted fonts (public/fonts), preloaded so text renders in the brand fonts without a late swap -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Light mode is the default. Re-apply a saved "dark" choice before first paint to avoid a flash. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
